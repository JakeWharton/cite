apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'java-gradle-plugin'
apply plugin: 'com.github.gmazzo.buildconfig'

gradlePlugin {
	plugins {
		cite {
			id = 'com.jakewharton.cite'
			displayName = "Cite"
			description = "Cite compiler plugin"
			implementationClass = "com.jakewharton.cite.plugin.gradle.CitePlugin"
		}
	}
}

buildConfig {
	useKotlinOutput {
		internalVisibility = true
		topLevelConstants = true
	}

	packageName('com.jakewharton.cite.plugin.gradle')
	buildConfigField("String", "CiteVersion", "\"$version\"")
}

kotlin {
	explicitApi()
}

dependencies {
	compileOnly libs.kotlin.gradlePlugin
	compileOnly libs.android.gradlePlugin

	testImplementation gradleTestKit()
	testImplementation libs.junit
	testImplementation libs.assertk
	testImplementation libs.asm.util
}

if (rootProject.name == 'cite') {
	apply plugin: 'com.vanniktech.maven.publish'

	test {
		dependsOn(':cite-api:publishAllPublicationsToTestMavenRepository')
		dependsOn(':cite-gradle-plugin:publishAllPublicationsToTestMavenRepository')
		dependsOn(':cite-kotlin-plugin:publishAllPublicationsToTestMavenRepository')

		inputs.dir(file('src/test/fixtures'))
	}
} else {
	// Move the build directory when included in build-logic so as to not poison the real build.
	// If we don't there's a chance incorrect build config values (configured above) will be used.
	layout.buildDirectory = new File(rootDir, "build/gradle-plugin")
}

tasks.withType(JavaCompile).configureEach { task ->
	task.sourceCompatibility = '11'
	task.targetCompatibility = '11'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinJvmCompile).configureEach { task ->
	task.kotlinOptions {
		jvmTarget = '11'
	}
}
